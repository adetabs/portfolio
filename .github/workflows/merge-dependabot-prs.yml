name: Merge Dependabot pull requests
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read
jobs:
  merge:
    name: Merge Dependabot pull requests
    runs-on: ubuntu-latest
    steps:
      - uses: adetabs/dependabot-cron-action@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          merge-method: squash
          auto-merge: minor  
